<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5a38">
<meta name="description" content="Daily recipe with ingredient checks, cooking timers, notes, and a session file you can download.">
<title>Daily recipe</title>
<link rel="stylesheet" href="../kitchen/hearth.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body class="page-recipe">
<a class="skip" href="#app">Skip to recipe</a>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="./"><small>Kitchen</small><strong>Daily recipe</strong></a>
    <nav class="nav" aria-label="Apps">
      <a href="../planner/">Week plan</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app">
  <p>Loading the cookbook…</p>
</main>
<div class="dock" id="dock" hidden aria-label="Active timers"></div>
<dialog id="gate" aria-labelledby="gateTitle">
  <form method="dialog">
    <h2 id="gateTitle"></h2>
    <p id="gateBody"></p>
    <div class="row">
      <button class="btn-quiet" value="cancel" type="submit" id="gateCancel">Cancel</button>
      <button class="btn-danger" value="ok" type="submit" id="gateOk">Continue</button>
    </div>
  </form>
</dialog>
<p class="sr" id="live" aria-live="polite"></p>
<input id="file" type="file" accept="application/json,.json" hidden>
<script src="../kitchen/state.js"></script>
<script src="../kitchen/illustrations.js"></script>
<script src="app.js"></script>
</body>
</html>
