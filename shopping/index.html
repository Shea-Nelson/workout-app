<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ee">
<meta name="description" content="This week's shopping list by store section, built from the meal plan and recipes. Check items off as you shop.">
<title>Shopping · Family kitchen</title>
<link rel="stylesheet" href="../kitchen/hearth.css">
<link rel="stylesheet" href="shopping.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body class="page-shopping">
<a class="skip" href="#app">Skip to the list</a>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="./"><small>Family kitchen</small><strong>Shopping</strong></a>
    <nav class="nav" aria-label="Kitchen">
      <a href="../planner/">Plan</a>
      <a href="../recipes/">Recipes</a>
      <a href="./" aria-current="page">Shopping</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app">
  <p>Loading the list…</p>
</main>
<dialog id="gate" aria-labelledby="gateTitle">
  <form method="dialog">
    <h2 id="gateTitle"></h2>
    <p id="gateBody"></p>
    <div class="row">
      <button class="btn-quiet" value="cancel" type="submit" id="gateCancel">Cancel</button>
      <button class="btn-danger" value="ok" type="submit" id="gateOk">Continue</button>
    </div>
  </form>
</dialog>
<p class="sr" id="live" aria-live="polite"></p>
<script src="../kitchen/state.js"></script>
<script src="list.js"></script>
<script src="app.js"></script>
</body>
</html>
